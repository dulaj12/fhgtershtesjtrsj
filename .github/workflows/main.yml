name: Ultimate Live Re-Stream to YouTube
on:
  workflow_dispatch:
    inputs:
      stream_url:
        description: 'ගංගා වීඩියෝ FB හෝ YouTube Live Link එක මෙතනට දෙන්න'
        required: true
      youtube_key:
        description: 'ඔයාගේ YouTube Stream Key එක මෙතනට දෙන්න'
        required: true

jobs:
  restream:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Disk Space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Install Tools (ffmpeg & yt-dlp)
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Re-Stream to YouTube
        run: |
          # මෙහිදී අපි libx264 පාවිච්චි කර වීඩියෝව අලුතින් Encode කරනවා (YouTube එකට ගැලපෙන ලෙස)
          yt-dlp -f "bestvideo[height<=480]+bestaudio/best[height<=480]" \
          --no-check-certificate \
          --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
          -o - "${{ github.event.inputs.stream_url }}" | \
          ffmpeg -re -i pipe:0 \
          -vcodec libx264 -preset veryfast -maxrate 2500k -bufsize 5000k -pix_fmt yuv420p \
          -g 50 -acodec aac -b:a 128k -ar 44100 \
          -f flv "rtmp://a.rtmp.youtube.com/live2/${{ github.event.inputs.youtube_key }}"
