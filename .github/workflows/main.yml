name: Ultimate Musical Downloader
on:
  workflow_dispatch:
    inputs:
      stream_url:
        description: 'Facebook හෝ YouTube Link එක මෙතනට දෙන්න'
        required: true

jobs:
  download_job:
    runs-on: ubuntu-latest
    steps:
      - name: Disk Space නිදහස් කිරීම
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Tools Install කිරීම
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Video එක Download කිරීම
        run: |
          yt-dlp -f "bestvideo[height<=480]+bestaudio/best[height<=480]" \
          --no-check-certificate \
          --no-playlist \
          --merge-output-format mp4 \
          --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
          "${{ github.event.inputs.stream_url }}" \
          -o "musical_video.mp4"

      - name: Video එක Artifacts වලට Upload කිරීම
        uses: actions/upload-artifact@v4
        with:
          name: Musical-Video-File
          path: "*.mp4"
          retention-days: 1
